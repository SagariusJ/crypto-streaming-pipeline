# Configuracion de Spark para escribir en AWS S3 real.
#
# Credenciales: perfil "crypto-pipeline" de ~/.aws/config (montado en el contenedor).
# Ese perfil asume el rol de minimo privilegio creado con Terraform, partiendo de tu
# sesion de IAM Identity Center. Sin access keys: el SDK renueva las credenciales
# temporales solo, mientras la sesion SSO siga vigente (aws sso login).

spark.master                                   local[*]
spark.sql.session.timeZone                     UTC
spark.sql.shuffle.partitions                   4

# El usuario "spark" de la imagen no tiene carpeta personal: el SDK de AWS busca
# ~/.aws en user.home, asi que lo apuntamos a donde montamos la configuracion.
spark.driver.extraJavaOptions                  -Duser.home=/home/spark

spark.hadoop.fs.s3a.impl                       org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint.region            us-east-1
spark.hadoop.fs.s3a.aws.credentials.provider   software.amazon.awssdk.auth.credentials.ProfileCredentialsProvider
