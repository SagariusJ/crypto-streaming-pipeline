[project]
name = "crypto-streaming-pipeline"
version = "0.1.0"
description = "Real-time crypto trades pipeline: Coinbase WebSocket -> Kafka -> Spark Structured Streaming -> S3"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "confluent-kafka>=2.16,<3",
    "prometheus-client>=0.26,<1",
    "websockets>=17,<18",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.13",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "crypto_stream"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
